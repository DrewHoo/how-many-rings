name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Least-privilege token for Pages deploys.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # Tailwind v4 ships a native engine binary (@tailwindcss/oxide). A macOS-
      # generated lockfile can skip the Linux variant, breaking `npm ci` builds.
      # Install the matching version explicitly; no-op (|| true) when unneeded.
      - run: npm install --no-save "@tailwindcss/oxide-linux-x64-gnu@$(node -p "require('@tailwindcss/oxide/package.json').version")" || true
      # `npm run build` rebuilds rings.json from data/staffs, type-checks, bundles,
      # then prerenders dist/index.html so crawlers get content instead of an empty div.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The link-preview worker (worker/) ships with the site. It needs a
  # CLOUDFLARE_API_TOKEN repo secret, a token made from the "Edit Cloudflare
  # Workers" template; until that secret exists the deploy step is skipped and
  # the job still passes, so a missing token never blocks the site. A scheduled
  # data refresh changes no worker code, so it would skip this too.
  worker:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'schedule'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.151.3'
          workingDirectory: worker
          command: deploy
